name: Publish Measurements v7

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack v7 release
        env:
          V7_PAYLOAD: [...TRUNCATED...]
        run: |
          printf '%s' "$V7_PAYLOAD" | base64 -d > /tmp/v7.tgz
          tar -xzf /tmp/v7.tgz -C .
          rm -f me-v7.js sw.js test-v7.js
      - name: Verify release
        run: |
          node --check me-v7-platform.js
          node --check me-v7-learning.js
          node --check me-v7-assessment.js
          node --check me-v7-pwa.js
          node test-smoke.js
      - name: Commit v7
        run: |
          rm -f .github/workflows/publish-v7.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Publish complete Measurements & Errors v7 platform'
          git push
