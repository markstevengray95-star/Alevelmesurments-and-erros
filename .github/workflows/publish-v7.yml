name: Publish Measurements v7

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify staged chunk hashes
        run: |
          sha256sum .v7clean/chunk00 .v7clean/chunk01 .v7clean/chunk02 .v7clean/chunk03 .v7clean/chunk04
          echo 'expected:'
          echo '7c69c4a91f41e3c7128d400f23cf80001c91c5f3724b7cc18c47e0025e874d0f chunk00'
          echo '1e79a3403dd20c9ced34e462daf6777595a21e642d4a9f1b39bea617a0af9c12 chunk01'
          echo '622da3797ea5fb172582a23756f1bc3c32056a5a92554c74285e0eca1e11d28e chunk02'
          echo '689f415862ace81b8435b7425c3a8ec44777867988fe9af7a3426c47c37be1f3 chunk03'
          echo '90f5ece82aadd4eda10429582290bf70a648a79ac4e1b4025dd3afe11567d2a7 chunk04'
          test "$(sha256sum .v7clean/chunk00 | cut -d' ' -f1)" = '7c69c4a91f41e3c7128d400f23cf80001c91c5f3724b7cc18c47e0025e874d0f'
          test "$(sha256sum .v7clean/chunk01 | cut -d' ' -f1)" = '1e79a3403dd20c9ced34e462daf6777595a21e642d4a9f1b39bea617a0af9c12'
          test "$(sha256sum .v7clean/chunk02 | cut -d' ' -f1)" = '622da3797ea5fb172582a23756f1bc3c32056a5a92554c74285e0eca1e11d28e'
          test "$(sha256sum .v7clean/chunk03 | cut -d' ' -f1)" = '689f415862ace81b8435b7425c3a8ec44777867988fe9af7a3426c47c37be1f3'
          test "$(sha256sum .v7clean/chunk04 | cut -d' ' -f1)" = '90f5ece82aadd4eda10429582290bf70a648a79ac4e1b4025dd3afe11567d2a7'
      - name: Unpack verified v7 release
        run: |
          cat .v7clean/chunk00 .v7clean/chunk01 .v7clean/chunk02 .v7clean/chunk03 .v7clean/chunk04 | base64 -d > /tmp/v7delta.tgz
          tar -tzf /tmp/v7delta.tgz
          tar -xzf /tmp/v7delta.tgz -C .
      - name: Verify v7 release
        run: |
          node --check me-v7.js
          node --check sw.js
          node test-smoke.js
      - name: Publish v7
        run: |
          rm -rf .v7clean .v7payload
          rm -f .github/workflows/publish-v7.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Publish complete Measurements & Errors v7 platform'
          git push
