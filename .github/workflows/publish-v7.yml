name: Publish Measurements v7

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack v7 release
        run: |
          cat .v7payload/chunk00 .v7payload/chunk01 .v7payload/chunk02 .v7payload/chunk03 .v7payload/chunk04 .v7payload/chunk05 | base64 -d > /tmp/v7delta.tgz
          tar -xzf /tmp/v7delta.tgz -C .
      - name: Generate embedded GLTF apparatus library
        run: |
          python - <<'PY'
          import base64,json,struct
          def box(cx,cy,cz,sx,sy,sz):
              x0,x1=cx-sx/2,cx+sx/2;y0,y1=cy-sy/2,cy+sy/2;z0,z1=cz-sz/2,cz+sz/2
              v=[(x0,y0,z0),(x1,y0,z0),(x1,y1,z0),(x0,y1,z0),(x0,y0,z1),(x1,y0,z1),(x1,y1,z1),(x0,y1,z1)]
              f=[0,1,2,0,2,3,4,6,5,4,7,6,0,4,5,0,5,1,3,2,6,3,6,7,1,5,6,1,6,2,0,3,7,0,7,4]
              return v,f
          shapes={
            'ruler':[(0,0,0,5,.18,.45)],
            'vernier':[(0,0,0,4.6,.18,.35),(-1.65,.55,0,.18,1.3,.35),(1.25,.45,0,.18,1.05,.35),(1.05,0,0,.8,.55,.42)],
            'micrometer':[(-1.7,0,0,.35,2.6,.5),(0,-1.15,0,3.7,.35,.5),(0,1.15,0,3.7,.35,.5),(1.7,.55,0,.35,1.55,.5),(1.7,-.55,0,.35,1.55,.5),(1,0,0,1.35,.35,.35),(2.25,0,0,.75,.85,.85)],
            'balance':[(0,-.85,0,2.8,.45,2),(0,.55,0,2.1,.28,1.45),(0,-.45,1.05,1.25,.55,.12)],
            'stopwatch':[(0,0,0,2.1,2.7,.55),(0,1.55,0,.75,.35,.45),(-.65,1.42,0,.35,.35,.4)],
            'thermometer':[(0,0,0,.32,4.4,.32),(0,-2.15,0,.75,.75,.75)],
            'lightgate':[(-1.25,0,0,.35,3,.5),(1.25,0,0,.35,3,.5),(0,-1.35,0,2.8,.35,.6),(0,1.35,0,2.8,.35,.6)],
            'multimeter':[(0,0,0,2.7,3.5,.75),(0,.75,.4,1.8,.85,.12),(0,-.75,.45,1.05,1.05,.12)]
          }
          colors={'ruler':[.65,.38,.12,1],'vernier':[.6,.66,.72,1],'micrometer':[.5,.56,.62,1],'balance':[.18,.23,.29,1],'stopwatch':[.12,.16,.22,1],'thermometer':[.78,.82,.86,1],'lightgate':[.08,.12,.16,1],'multimeter':[.12,.16,.2,1]}
          def glb(parts,color):
              verts=[]; inds=[]
              for p in parts:
                  v,f=box(*p); off=len(verts); verts+=v; inds += [i+off for i in f]
              pos=b''.join(struct.pack('<3f',*v) for v in verts); idx=b''.join(struct.pack('<H',i) for i in inds)
              pos+=b'\0'*((4-len(pos)%4)%4); binbuf=pos+idx; binbuf+=b'\0'*((4-len(binbuf)%4)%4)
              xs=[v[0] for v in verts];ys=[v[1] for v in verts];zs=[v[2] for v in verts]
              doc={'asset':{'version':'2.0','generator':'Measurements v7'},'scene':0,'scenes':[{'nodes':[0]}],'nodes':[{'mesh':0}],'meshes':[{'primitives':[{'attributes':{'POSITION':0},'indices':1,'material':0}]}],'materials':[{'pbrMetallicRoughness':{'baseColorFactor':color,'metallicFactor':.55,'roughnessFactor':.35}}],'buffers':[{'byteLength':len(binbuf)}],'bufferViews':[{'buffer':0,'byteOffset':0,'byteLength':len(pos),'target':34962},{'buffer':0,'byteOffset':len(pos),'byteLength':len(idx),'target':34963}],'accessors':[{'bufferView':0,'componentType':5126,'count':len(verts),'type':'VEC3','min':[min(xs),min(ys),min(zs)],'max':[max(xs),max(ys),max(zs)]},{'bufferView':1,'componentType':5123,'count':len(inds),'type':'SCALAR','min':[0],'max':[max(inds)]}]}
              js=json.dumps(doc,separators=(',',':')).encode(); js+=b' '*((4-len(js)%4)%4)
              total=12+8+len(js)+8+len(binbuf)
              return struct.pack('<4sII',b'glTF',2,total)+struct.pack('<II',len(js),0x4E4F534A)+js+struct.pack('<II',len(binbuf),0x004E4942)+binbuf
          assets={k:base64.b64encode(glb(v,colors[k])).decode() for k,v in shapes.items()}
          open('gltf-assets.js','w').write("'use strict';\nwindow.MeasurementGLTFAssets="+json.dumps(assets,separators=(',',':'))+';\n')
          PY
      - name: Verify v7 release
        run: |
          node --check me-v7-platform.js
          node --check me-v7-learning.js
          node --check me-v7-assessment.js
          node --check me-v7-pwa.js
          node --check gltf-assets.js
          node test-smoke.js
      - name: Publish v7
        run: |
          rm -rf .v7payload
          rm -f .github/workflows/publish-v7.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Publish complete Measurements & Errors v7 platform'
          git push
# all release chunks present
